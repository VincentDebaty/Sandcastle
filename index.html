<title>Marée Haute</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Un seul univers visuel, assumé : plage en plein jour. Écran unique : seau de sable en haut, plage au centre, commandes en bas. */
  :root {
    --sea-deep: #0b5466;
    --sea: #13798c;
    --foam: #eef8f4;
    --sand: #ecd29b;
    --sand-dark: #b98f55;
    --flag: #e2463a;
    --ink: #10323a;
    --panel: #eef8f4;
    --muted: #4c6f75;
    --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sea-deep);
    color: var(--foam);
    font-family: var(--font-body);
    font-size: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    max-width: 560px;
    margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { min-width: 0; }
  .title small { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
  .title h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; text-wrap: balance; }

  .bucket { display: flex; align-items: center; gap: 10px; }
  .bucket .lbl { font-weight: 700; font-size: 14px; min-width: 4.6em; font-variant-numeric: tabular-nums; }
  .bar { position: relative; flex: 1; height: 18px; border-radius: 9px; background: rgba(0, 0, 0, 0.22); overflow: visible; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 9px; background: var(--sand); transition: width 120ms linear; }
  .bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--foam); border-radius: 1px; }
  .bar .mark span { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; color: var(--sand); letter-spacing: 1px; }
  .bucket.empty .bar { animation: shake 320ms; }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .hint { margin: 10px 0 0; font-size: 15px; line-height: 1.35; opacity: 0.95; min-height: 2.7em; text-wrap: pretty; }
  .board { flex: 1; min-height: 0; position: relative; border-radius: 16px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .controls { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 14px;
    padding: 12px 10px; min-height: 52px; color: var(--ink); background: var(--foam);
  }
  button.ghost { background: rgba(238, 248, 244, 0.14); color: var(--foam); }
  button.go { background: var(--sand); color: var(--ink); font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0.02em; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--sand); outline-offset: 2px; }
  .small-btn { min-height: 40px; padding: 8px 14px; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: center;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: rgba(6, 40, 50, 0.6);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  }
  .card {
    pointer-events: auto;
    width: 100%; max-width: 440px; max-height: 100%; overflow: auto; box-sizing: border-box;
    background: var(--panel); color: var(--ink); border-radius: 20px; padding: 18px 20px 20px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  .sheet .card { animation: rise 260ms ease-out; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; text-wrap: balance; }
  .card p { margin: 0; line-height: 1.45; }
  .stars { display: flex; gap: 6px; font-size: 34px; line-height: 1; color: var(--sand-dark); }
  .stars .off { opacity: 0.22; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { flex: 1 1 140px; }
  .card .ghost { background: rgba(16, 50, 58, 0.08); color: var(--ink); }
  .card .primary { background: var(--sea); color: var(--foam); }

  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .levels button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    background: rgba(16, 50, 58, 0.07); color: var(--ink); padding: 10px; min-height: 72px;
  }
  .levels button.current { outline: 3px solid var(--sea); }
  .levels .num { font-family: var(--font-display); font-size: 22px; line-height: 1; }
  .levels .nm { font-size: 12px; line-height: 1.2; }
  .levels .st { font-size: 13px; letter-spacing: 1px; color: var(--sand-dark); }
  @media (prefers-reduced-motion: reduce) { .sheet .card, .bucket.empty .bar { animation: none; } }
</style>

<div class="app">
  <header>
    <div class="title">
      <small id="level-num">Niveau 1</small>
      <h1 id="level-name">La crique</h1>
    </div>
    <button class="ghost small-btn" id="btn-menu" type="button">Niveaux</button>
  </header>

  <div class="bucket" id="bucket">
    <span class="lbl" id="bucket-label">Sable 90</span>
    <div class="bar" id="bar"><div class="fill" id="bar-fill"></div></div>
  </div>

  <p class="hint" id="hint" aria-live="polite"></p>

  <div class="board" id="board">
    <canvas id="canvas" aria-label="La plage : trace des murs de sable avec le doigt"></canvas>
  </div>

  <div class="controls">
    <button class="ghost" id="btn-undo" type="button">Annuler</button>
    <button class="go" id="btn-tide" type="button">Marée !</button>
    <button class="ghost" id="btn-clear" type="button">Effacer</button>
  </div>
</div>

<div class="sheet" id="result" hidden>
  <div class="card" role="dialog" aria-labelledby="result-title">
    <h2 id="result-title">Château sauvé !</h2>
    <div class="stars" id="result-stars"></div>
    <p id="result-text"></p>
    <div class="row" id="result-actions"></div>
  </div>
</div>

<div class="overlay" id="menu" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <h2 id="menu-title">Marée Haute</h2>
    <p>Trace des murs de sable pour protéger le château, puis lance la marée. L’eau passe partout où il n’y a pas de mur.</p>
    <div class="levels" id="levels"></div>
    <div class="row"><button class="primary" id="btn-close-menu" type="button">Jouer</button></div>
  </div>
</div>

<script src="src/sim.js"></script>
<script src="src/levels.js"></script>
<script src="src/app.js"></script>
